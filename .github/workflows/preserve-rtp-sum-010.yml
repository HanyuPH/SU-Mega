name: Preservar artefatos do RTP-SUM-010

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/preserve-rtp-sum-010.yml"

permissions:
  contents: write
  actions: read

jobs:
  preserve-documentary-artifacts:
    if: github.event.pull_request.head.ref == 'automation/preserve-rtp-sum-010-artifact'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: agent/preservacao-rtp-sum-010
      ARTIFACT_ID: "8930794467"
      ARTIFACT_ZIP_SHA256: 56d8b0ff3a6f85e27b7058ab777762862440ee5d88d1b741f52159765895ae8f
      TAR_GZ_SHA256: 5b0595b071b217dedfae69212256ae87ff86df993e249f35af31967de507d26a
      SUMMARY_SHA256: eb95946804f46eb5fcbebeac77b51885d55a08c4c8dbaa1cb8dd781c8c188bb8
      IDENTITY_SHA256: 5e86d1d336e90a42b17cf9d32593a36bb537913cba8eb440df7b5975b4f6ca8a
      FILES_MANIFEST_SHA256: 7d0af586bf6ccce0c6b4586dee84ecc203b8c0c47aa92448436a5cd065d81c99
      PORTFOLIOS_AGGREGATE_SHA256: 790b458de46b09d6b8a30227cff89da6b0b566ba53e9d7e8a29c0b4c82bcde21
      OFFICIAL_COMMIT: 02717317bfa523f125324b406a68c07b128a396d
      AUTHORIZATION_ID: AUT-USUARIO-20260805-0938-RTP-SUM-009
    steps:
      - name: Baixar a branch documental
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirmar escopo inicial
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test -z "$(git status --porcelain)"
          test -f generator/docs/RTP-SUM-010-resultado-revalidacao-multissementes-oficial.md
          test ! -e generator/evidence/rtp-sum-010

      - name: Baixar e conferir o artefato temporário
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/rtp-sum-010-artifact.zip
          echo "$ARTIFACT_ZIP_SHA256  /tmp/rtp-sum-010-artifact.zip" | sha256sum -c -
          mkdir -p /tmp/rtp-sum-010-artifact
          unzip -q /tmp/rtp-sum-010-artifact.zip -d /tmp/rtp-sum-010-artifact

      - name: Preservar documentos e evidências
        run: |
          set -euo pipefail
          mkdir -p generator/evidence/rtp-sum-010
          cat > /tmp/evidence-json.gz.b64 <<'B64'

B64
          base64 -d /tmp/evidence-json.gz.b64 | gzip -d > generator/evidence/rtp-sum-010/RTP-SUM-010-evidencias-resumo.json
          ARTIFACT_ROOT=/tmp/rtp-sum-010-artifact/su-mega-rtp-sum-009-battery-20260805-0938
          cp "$ARTIFACT_ROOT/identity/identity-report.json" generator/evidence/rtp-sum-010/identity-report.json
          cp "$ARTIFACT_ROOT/multiseed-summary.json" generator/evidence/rtp-sum-010/multiseed-summary.json
          cp "$ARTIFACT_ROOT/files-sha256.txt" generator/evidence/rtp-sum-010/files-sha256.txt
          cp /tmp/rtp-sum-010-artifact/RTP-SUM-009-bateria-30-sementes-20260805.tar.gz generator/evidence/rtp-sum-010/
          cat > /tmp/generate-preservation.py.gz.b64 <<'B64'

B64
          base64 -d /tmp/generate-preservation.py.gz.b64 | gzip -d > /tmp/generate-preservation.py
          python /tmp/generate-preservation.py

      - name: Verificar hashes e escopo documental
        run: |
          set -euo pipefail
          echo "$TAR_GZ_SHA256  generator/evidence/rtp-sum-010/RTP-SUM-009-bateria-30-sementes-20260805.tar.gz" | sha256sum -c -
          echo "$SUMMARY_SHA256  generator/evidence/rtp-sum-010/multiseed-summary.json" | sha256sum -c -
          echo "$IDENTITY_SHA256  generator/evidence/rtp-sum-010/identity-report.json" | sha256sum -c -
          echo "$FILES_MANIFEST_SHA256  generator/evidence/rtp-sum-010/files-sha256.txt" | sha256sum -c -
          test "$(jq -r '.execution.officialCommit' generator/evidence/rtp-sum-010/RTP-SUM-010-evidencias-resumo.json)" = "$OFFICIAL_COMMIT"
          test "$(jq -r '.execution.authorizationId' generator/evidence/rtp-sum-010/RTP-SUM-010-evidencias-resumo.json)" = "$AUTHORIZATION_ID"
          test "$(jq -r '.battery.executedSeeds' generator/evidence/rtp-sum-010/RTP-SUM-010-evidencias-resumo.json)" = "30"
          test "$(jq -r '.hashes.orderedPortfolioHashesSha256' generator/evidence/rtp-sum-010/RTP-SUM-010-evidencias-resumo.json)" = "$PORTFOLIOS_AGGREGATE_SHA256"
          test "$(jq -r '.rows | length' generator/evidence/rtp-sum-010/portfolio-hashes.json)" = "30"
          test -z "$(git status --short | awk '{print $2}' | grep -Ev '^generator/evidence/rtp-sum-010/' || true)"
          test ! -e .github/workflows/execute-rtp-sum-009-battery.yml

      - name: Commitar na branch documental
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator/evidence/rtp-sum-010
          git commit -m "docs: preservar evidências definitivas do RTP-SUM-010"
          git push origin "HEAD:$TARGET_BRANCH"
