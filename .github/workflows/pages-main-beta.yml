name: Publicar SU Mega estável e Beta

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar versão estável
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable

      - name: Baixar versão Beta
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta-source

      - name: Montar e validar site
        run: |
          mkdir -p public/beta
          rsync -a --exclude='.git' --exclude='.github' stable/ public/
          rsync -a --exclude='.git' --exclude='.github' beta-source/ public/beta/
          touch public/.nojekyll public/beta/.nojekyll

          # Estável preservada
          test -f public/index.html
          grep -q 'stable-su-mega-c2-v19' public/service-worker.js
          ! grep -q 'beta-banner.js' public/service-worker.js
          node --check public/service-worker.js

          # Beta v29
          for file in index.html service-worker.js official-results.js realtime-cloud.js contest-bets.js contest-bets-cloud.js contest-lock.js contest-session.js contest-selection-ui.js beta-banner.js; do
            test -f "public/beta/$file"
          done
          grep -q 'const BUILD = "v29"' public/beta/beta-banner.js
          grep -q 'su-mega-c2-beta-v29' public/beta/service-worker.js
          grep -q "beta-banner.js?v=29" public/beta/service-worker.js
          grep -q 'const localModules' public/beta/service-worker.js
          grep -q 'const cloudModules' public/beta/service-worker.js
          grep -q 'Promise.allSettled' public/beta/service-worker.js
          grep -q 'cachedIgnoringVersion' public/beta/service-worker.js
          grep -q 'ignoreSearch: true' public/beta/service-worker.js
          grep -q 'contest-bets.js?v=3' public/beta/service-worker.js
          grep -q 'contest-session.js?v=2' public/beta/service-worker.js
          grep -q 'contest-selection-ui.js?v=1' public/beta/service-worker.js
          grep -q 'realtime-cloud.js?v=2' public/beta/service-worker.js
          grep -q 'contest-bets-cloud.js?v=4' public/beta/service-worker.js
          grep -q 'persistentMultipleTabManager' public/beta/realtime-cloud.js
          grep -q 'Sincronizado em tempo real' public/beta/realtime-cloud.js
          grep -q 'Concurso selecionado' public/beta/contest-selection-ui.js
          grep -q 'Reabrir concurso' public/beta/contest-session.js
          grep -q 'Resultado publicado • bloqueado' public/beta/contest-lock.js
          for file in service-worker.js official-results.js realtime-cloud.js contest-bets.js contest-bets-cloud.js contest-lock.js contest-session.js contest-selection-ui.js; do
            node --check "public/beta/$file"
          done

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
